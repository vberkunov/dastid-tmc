function store(k, v) { try { if (v == null) { localStorage.removeItem(k); sessionStorage.removeItem(k); } else { sessionStorage.setItem(k, v); if (document.getElementById('r').checked) localStorage.setItem(k, v); } } catch (x) {} }
function saved() { try { return sessionStorage.getItem('tmc-pw') || localStorage.getItem('tmc-pw'); } catch (x) { return null; } }
function open(pw, silent) {
